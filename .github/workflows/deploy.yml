name: Continuous Deployment

# Varsayılan olarak KAPALIDIR. Etkinleştirmek için repo ayarlarında:
#   Variables: DEPLOY_ENABLED=true (zorunlu), DEPLOY_PATH (isteğe bağlı, varsayılan /opt/core)
#   Secrets:   HOST, USERNAME, SSH_KEY, PORT (isteğe bağlı, varsayılan 22)
# Ayrıntılar: .knowledge/_rules/deployment-cicd.md

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify docker-compose.yml exists
        run: |
          if [ ! -f docker-compose.yml ] && [ ! -f compose.yml ]; then
            echo "::error::docker-compose.yml bulunamadı. Onboarding'de oluşturulmadan deploy yapılamaz."
            exit 1
          fi

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '/opt/core' }}
            git pull --ff-only origin main
            docker compose up -d --remove-orphans
